services:
  - type: web
    name: bioguard-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__MongoDB
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: BioGuardApi
      - key: Jwt__Audience
        value: BioGuardApp
