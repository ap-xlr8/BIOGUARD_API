name: bioguard-api-staging
region: nyc

services:
  - name: bioguard-api-staging
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: lizperz/backend-bioguard
      digest: ${IMAGE_DIGEST}

    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs

    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: AllowedHosts
        value: ${STAGING_ALLOWED_HOSTS}
      - key: MONGODB_CONNECTION_STRING
        value: ${STAGING_MONGODB_CONNECTION_STRING}
        type: SECRET
      - key: JWT_SECRET_KEY
        value: ${STAGING_JWT_SECRET_KEY}
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        value: ${STAGING_GOOGLE_CLIENT_ID}
        type: SECRET
      - key: STRIPE_SECRET_KEY
        value: ${STAGING_STRIPE_SECRET_KEY}
        type: SECRET
      - key: PAYPAL_CLIENT_ID
        value: ${STAGING_PAYPAL_CLIENT_ID}
        type: SECRET
      - key: FIREBASE_SERVER_KEY
        value: ${STAGING_FIREBASE_SERVER_KEY}
        type: SECRET
