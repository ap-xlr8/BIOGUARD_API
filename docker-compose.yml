version: "3.8"

services:
  bioguard-api:
    build:
      context: .
      dockerfile: BioGuard.Api/Dockerfile
    container_name: bioguard-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MONGODB_CONNECTION_STRING=${MONGODB_CONNECTION_STRING}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - Smtp__Password=${SMTP_PASSWORD}
      - Firebase__CredentialsPath=${FIREBASE_CREDENTIALS_PATH}
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - PayPal__ClientId=${PAYPAL_CLIENT_ID}
      - PayPal__ClientSecret=${PAYPAL_CLIENT_SECRET}
      - ImgBB__ApiKey=${IMGBB_API_KEY}
      - Cripto__Key=${CRIPTO_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
